[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "traceable-support"
version = "0.1.0b0"
description = "Fail-closed, evidence-bound support candidate service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = [
  "fastembed==0.8.0",
  "numpy==2.4.2",
  "onnxruntime==1.24.2",
  "rank-bm25==0.2.2",
  "tokenizers==0.22.2",
]
test = ["pytest==9.0.2"]

[project.scripts]
traceable-support-api = "traceable_support.api.http:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceable_support"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
