# Local convenience stack for manual verification; nothing here is a production contract.
#
# Optional pgvector backend for the retrieval vector store (throwaway, local-only,
# trust auth, bound to 127.0.0.1):
#   docker compose -f deploy/compose.local.yaml up -d pgvector
#   export TRACEABLE_RETRIEVAL_VECTOR_DSN=postgresql://traceable@127.0.0.1:5432/traceable
#   export PGVECTOR_TEST_DSN=postgresql://traceable@127.0.0.1:5432/traceable
# With PGVECTOR_TEST_DSN set, `python -m pytest api/tests/test_pgvector_store.py`
# runs the store integration tests against this database instead of skipping.
name: traceable-support-local

services:
  web:
    image: traceable-support-web:local
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${TRACEABLE_LOCAL_API_PORT:-8000}
        VCS_REF: local
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - 127.0.0.1:${TRACEABLE_LOCAL_WEB_PORT:-3000}:3000
    pids_limit: 160

  api-data-init:
    image: traceable-support-api-replay:local
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: replay
      args:
        VCS_REF: local
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    entrypoint: ["chown", "-R", "10001:10001", "/var/lib/traceable"]
    volumes:
      - traceable-data:/var/lib/traceable

  api:
    image: traceable-support-api-replay:local
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: replay
      args:
        VCS_REF: local
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TRACEABLE_PUBLIC_ORIGIN: http://127.0.0.1:${TRACEABLE_LOCAL_WEB_PORT:-3000}
      TRACEABLE_PUBLIC_LIVE_ENABLED: "false"
    volumes:
      - traceable-data:/var/lib/traceable
    ports:
      - 127.0.0.1:${TRACEABLE_LOCAL_API_PORT:-8000}:8000
    pids_limit: 180
    depends_on:
      api-data-init:
        condition: service_completed_successfully

  pgvector:
    image: pgvector/pgvector:pg17
    init: true
    environment:
      POSTGRES_USER: traceable
      POSTGRES_DB: traceable
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 127.0.0.1:${TRACEABLE_LOCAL_PGVECTOR_PORT:-5432}:5432
    volumes:
      - traceable-pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceable -d traceable"]
      interval: 5s
      timeout: 3s
      retries: 12
    pids_limit: 180

volumes:
  traceable-data:
    name: traceable-support-local-data
  traceable-pgvector:
    name: traceable-support-local-pgvector
