name: deploy-production
run-name: "production deploy for ci-release #${{ github.event.workflow_run.id || inputs.publish_run_id }}"

on:
  workflow_run:
    workflows: ["ci-release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful ci-release run ID containing release-manifest
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: traceable-support-production
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.decision.outputs.classification }}
      deploy_required: ${{ steps.decision.outputs.deploy_required }}
      git_sha: ${{ steps.decision.outputs.git_sha }}
      run_attempt: ${{ steps.decision.outputs.run_attempt }}
    env:
      PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
      PUBLISH_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
      PUBLISH_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
    steps:
      - name: Check out the trusted deployment controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Validate release decision before production
        id: decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          run_metadata="$RUNNER_TEMP/traceable-release-run.json"
          artifacts_metadata="$RUNNER_TEMP/traceable-release-artifacts.json"
          selection_output="$RUNNER_TEMP/traceable-release-selection.env"
          decision_output="$RUNNER_TEMP/traceable-release-decision.env"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID" \
            >"$run_metadata"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID/artifacts?per_page=100" \
            >"$artifacts_metadata"
          selection_args=(
            --run "$run_metadata"
            --artifacts "$artifacts_metadata"
            --repository "$GITHUB_REPOSITORY"
            --run-id "$PUBLISH_RUN_ID"
            --github-output "$selection_output"
          )
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            selection_args+=(--manual)
          fi
          if [[ -n "$PUBLISH_HEAD_SHA" ]]; then
            selection_args+=(--expected-git-sha "$PUBLISH_HEAD_SHA")
          fi
          if [[ -n "$PUBLISH_RUN_ATTEMPT" ]]; then
            selection_args+=(--expected-run-attempt "$PUBLISH_RUN_ATTEMPT")
          fi
          python tools/release_run.py "${selection_args[@]}"
          source "$selection_output"
          if [[ -z "$release_decision_artifact_id" ]]; then
            cat "$selection_output" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          decision_dir="$RUNNER_TEMP/traceable-release-decision"
          install -d -m 700 "$decision_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$release_decision_artifact_id/zip" \
            >"$RUNNER_TEMP/release-decision.zip"
          python -m zipfile -e "$RUNNER_TEMP/release-decision.zip" "$decision_dir"
          verify_args=(
            --verify "$decision_dir/release-decision.json"
            --git-sha "$git_sha"
            --github-run-id "$PUBLISH_RUN_ID"
            --github-run-attempt "$run_attempt"
            --github-output "$decision_output"
          )
          python tools/release_decision.py "${verify_args[@]}"
          source "$decision_output"
          if [[ "$deploy_required" == true && -z "$release_manifest_artifact_id" ]]; then
            echo "release_manifest_missing" >&2
            exit 65
          fi
          cat "$selection_output" "$decision_output" >>"$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.deploy_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
      PUBLISH_HEAD_SHA: ${{ needs.preflight.outputs.git_sha }}
      PUBLISH_RUN_ATTEMPT: ${{ needs.preflight.outputs.run_attempt }}
    steps:
      - name: Check out the trusted deployment controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Stage trusted deployment controller
        run: |
          set -Eeuo pipefail
          controller_dir="$RUNNER_TEMP/traceable-deploy-controller"
          install -d -m 700 "$controller_dir"
          install -m 600 tools/validate_deploy_port.py "$controller_dir/validate_deploy_port.py"
          install -m 600 tools/deploy_ssh_transport.py "$controller_dir/deploy_ssh_transport.py"
      - name: Download manifest from the selected green run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-manifest
          run-id: ${{ env.PUBLISH_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/traceable-release-artifact
      - name: Bind manifest to the selected green run
        id: manifest
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/traceable-release-artifact/release-manifest.json
        run: |
          set -Eeuo pipefail
          verify_args=(
            --verify "$RELEASE_MANIFEST"
            --github-run-id "$PUBLISH_RUN_ID"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$PUBLISH_HEAD_SHA" ]]; then
            verify_args+=(--git-sha "$PUBLISH_HEAD_SHA")
          fi
          if [[ -n "$PUBLISH_RUN_ATTEMPT" ]]; then
            verify_args+=(--github-run-attempt "$PUBLISH_RUN_ATTEMPT")
          fi
          python tools/release_manifest.py "${verify_args[@]}"
      - name: Check out the manifest commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.manifest.outputs.git_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify manifest and main ancestry
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/traceable-release-artifact/release-manifest.json
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.manifest.outputs.git_sha }}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          python tools/release_manifest.py --verify "$RELEASE_MANIFEST"
      - name: Build live API image on the production host
        id: live_image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          # The live API image carries offline model assets and is built on the
          # production host (no registry publish; the manifest pins the local
          # image ID). The provider credential is never touched here: the host
          # already holds /opt/traceable-support/provider.env (0600).
          ssh_dir="$RUNNER_TEMP/traceable-live-ssh"
          install -d -m 700 "$ssh_dir"
          # GitHub secrets were pasted on Windows and carry a leading UTF-8 BOM
          # and CR bytes (the trusted controller strips them the same way);
          # normalize at byte level: strip one BOM, drop CR, unescape any
          # literal \n sequences, and guarantee a trailing newline.
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed '1s/^\xef\xbb\xbf//' | tr -d '\r' | sed 's/\\n/\n/g' > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed '1s/^\xef\xbb\xbf//' | tr -d '\r' | sed 's/\\n/\n/g' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/known_hosts"
          host="$(python3 -c 'import os; print(os.environ["DEPLOY_HOST"].strip("\ufeff \t\r\n"))')"
          user="$(python3 -c 'import os; print(os.environ["DEPLOY_USER"].strip("\ufeff \t\r\n"))')"
          port="$(python3 -c 'import os; print(os.environ.get("DEPLOY_PORT", "").strip("\ufeff \t\r\n") or "22")')"
          ssh_opts=(-F /dev/null -i "$ssh_dir/key" -o BatchMode=yes -o ConnectionAttempts=1 -o ConnectTimeout=15 -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -p "$port")
          destination="$user@$host"
          git archive HEAD | ssh "${ssh_opts[@]}" "$destination" 'rm -rf /tmp/ts-live-build && mkdir -m 700 -p /tmp/ts-live-build && tar -x -C /tmp/ts-live-build'
          image_id="$(ssh "${ssh_opts[@]}" "$destination" 'cd /tmp/ts-live-build && DOCKER_BUILDKIT=1 docker build --quiet --target live -t traceable-local/traceable-support-agent-api-live:staging -f api/Dockerfile . >/dev/null 2>&1 && docker image inspect --format "{{.Id}}" traceable-local/traceable-support-agent-api-live:staging; status=$?; rm -rf /tmp/ts-live-build; exit $status')"
          case "$image_id" in sha256:*) ;; *) echo "live_image_id_invalid" >&2; exit 1;; esac
          echo "image_ref=traceable-local/traceable-support-agent-api-live@${image_id}" >> "$GITHUB_OUTPUT"
      - name: Generate and verify the live (v2) release manifest
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/traceable-release-artifact/release-manifest.json
        run: |
          set -Eeuo pipefail
          web_image="$(python3 -c 'import json, os; print(json.load(open(os.environ["RELEASE_MANIFEST"]))["images"]["web"])')"
          python tools/release_manifest.py --experience live \
            --git-sha "$(git rev-parse HEAD)" \
            --web-image "$web_image" \
            --api-image "${{ steps.live_image.outputs.image_ref }}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --github-run-id "$PUBLISH_RUN_ID" \
            --github-run-attempt "${PUBLISH_RUN_ATTEMPT:-1}" \
            --output "$RUNNER_TEMP/release-manifest-live.json"
          python tools/release_manifest.py --verify "$RUNNER_TEMP/release-manifest-live.json"
      - name: Build public deployment package
        env:
          LIVE_RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest-live.json
        run: |
          mkdir -p release-staging/deploy release-staging/tools
          cp "$LIVE_RELEASE_MANIFEST" release-staging/release-manifest.json
          cp deploy/compose.production.yaml deploy/release-lib.sh deploy/activate-release.sh \
            deploy/rollback-release.sh deploy/switch_release_state.py \
            deploy/install_release.py release-staging/deploy/
          cp tools/release_manifest.py release-staging/tools/
          cp deploy/production-target.json release-staging/deployment-input.json
      - name: Verify trusted deployment controller integrity
        run: |
          set -Eeuo pipefail
          controller_dir="$RUNNER_TEMP/traceable-deploy-controller"
          printf '%s  %s\n' \
            '6a1af83611a5164e53a8697fe654725a867fe8bc8a8e1b81af01d34cc2b70e52' "$controller_dir/validate_deploy_port.py" \
            '0ac333ace233077586ad161bd579bc7708e2345e8f0a03f8886f2c91aa9e4166' "$controller_dir/deploy_ssh_transport.py" \
            | /usr/bin/sha256sum --check --strict
      - name: Upload and activate with strict host verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BASH_ENV: /dev/null
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 -E "$RUNNER_TEMP/traceable-deploy-controller/deploy_ssh_transport.py" \
            --staging release-staging \
            --remote-stage "/tmp/traceable-support-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --release-root /opt/traceable-support
