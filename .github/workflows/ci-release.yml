name: ci-release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.impact.outputs.classification }}
    steps:
      - name: Check out full public history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Classify changed paths
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]]; then
            base_sha="$PUSH_BASE_SHA"
          fi
          python tools/ci_impact.py \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Generate immutable release decision
        env:
          CLASSIFICATION: ${{ steps.impact.outputs.classification }}
          CHANGED_PATHS_SHA256: ${{ steps.impact.outputs.changed_paths_sha256 }}
        run: |
          set +e
          deploy_required=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$CLASSIFICATION" == runtime ]]; then
            deploy_required=true
          fi
          status=0
          python tools/release_decision.py \
            --output release-decision.json \
            --git-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --classification "$CLASSIFICATION" \
            --deploy-required "$deploy_required" \
            --changed-paths-sha256 "$CHANGED_PATHS_SHA256" || status=1
          if [[ "$status" == 0 ]]; then
            python tools/release_decision.py --verify release-decision.json || status=1
          fi
          python3 tools/ci_proof.py record \
            --claim governance.release-decision \
            --category boundary \
            --exit-code "$status" \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
          exit "$status"
      - name: Store release decision
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-decision
          path: release-decision.json
          if-no-files-found: error
          retention-days: 30
      - name: Test governance tools
        run: |
          python3 tools/ci_proof.py run \
            --claim governance.tooling \
            --category product \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -m unittest discover -s tools/tests -p "test_*.py"
      - name: Run advisory document gardener
        continue-on-error: true
        run: python tools/doc_gardener.py --format markdown
      - name: Scan current tree and full history
        run: |
          python3 tools/ci_proof.py run \
            --claim governance.public-repo-hygiene \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python tools/check_public_repo.py --scope tree
          python3 tools/ci_proof.py run \
            --claim governance.public-repo-hygiene \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python tools/check_public_repo.py --scope history --expect-migration-history
      - name: Check whitespace
        run: |
          python3 tools/ci_proof.py run \
            --claim governance.whitespace \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
      - name: Publish proof summary
        if: always()
        run: |
          python3 tools/ci_proof.py summary \
            --job governance \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --expect governance.release-decision \
            --expect governance.tooling \
            --expect governance.public-repo-hygiene \
            --expect governance.whitespace

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]]; then
            base_sha="$PUSH_BASE_SHA"
          fi
          python ../tools/ci_impact.py \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record skipped runtime checks (governance-only change)
        if: steps.impact.outputs.classification == 'governance_only'
        run: |
          python3 ../tools/ci_proof.py skip \
            --claim web.dependencies \
            --claim web.dependency-advisory \
            --claim web.static-contract \
            --claim web.build-and-tests \
            --claim web.routes \
            --reason governance_only \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
      - name: Set up Node
        if: steps.impact.outputs.classification == 'runtime'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          python3 ../tools/ci_proof.py run \
            --claim web.dependencies \
            --category external \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            npm ci
      - name: Audit dependencies (blocking only on dependency changes)
        if: steps.impact.outputs.classification == 'runtime' && steps.impact.outputs.web_dependency_files_changed == 'true'
        run: |
          python3 ../tools/ci_proof.py run \
            --claim web.dependency-advisory \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Record skipped dependency audit (dependencies unchanged)
        if: steps.impact.outputs.classification == 'runtime' && steps.impact.outputs.web_dependency_files_changed == 'false'
        run: |
          python3 ../tools/ci_proof.py skip \
            --claim web.dependency-advisory \
            --reason dependencies_unchanged \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
      - name: Lint and typecheck
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          python3 ../tools/ci_proof.py run \
            --claim web.static-contract \
            --category product \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            npm run lint
          python3 ../tools/ci_proof.py run \
            --claim web.static-contract \
            --category product \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            npm run typecheck
      - name: Build and test
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          python3 ../tools/ci_proof.py run \
            --claim web.build-and-tests \
            --category product \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            npm test
      - name: Smoke four standalone routes with content assertions
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          set +e
          status=0
          npm start >"$RUNNER_TEMP/traceable-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "web_server_not_ready" >&2
            status=1
          fi
          for route in / /design /app /privacy; do
            body="$RUNNER_TEMP/traceable-route.html"
            if ! curl --fail --silent --show-error "http://127.0.0.1:3000$route" >"$body"; then
              echo "route_failed:$route" >&2
              status=1
            elif ! grep -q '<html lang="zh-CN">' "$body"; then
              echo "route_content_missing:$route" >&2
              status=1
            fi
          done
          if ! curl --fail --silent http://127.0.0.1:3000/ | grep -q '有证据'; then
            echo "homepage_headline_missing" >&2
            status=1
          fi
          python3 ../tools/ci_proof.py record \
            --claim web.routes \
            --category product \
            --exit-code "$status" \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
          exit "$status"
      - name: Publish proof summary
        if: always()
        run: |
          python3 ../tools/ci_proof.py summary \
            --job web \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --expect web.dependencies \
            --expect web.dependency-advisory \
            --expect web.static-contract \
            --expect web.build-and-tests \
            --expect web.routes

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: traceable
          POSTGRES_DB: traceable_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceable -d traceable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]]; then
            base_sha="$PUSH_BASE_SHA"
          fi
          python tools/ci_impact.py \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record skipped runtime checks (governance-only change)
        if: steps.impact.outputs.classification == 'governance_only'
        run: |
          python3 tools/ci_proof.py skip \
            --claim api.dependencies \
            --claim api.model-download \
            --claim api.audit-tool-install \
            --claim api.dependency-advisory \
            --claim api.product-tests \
            --claim api.pgvector-store \
            --claim api.eval-runner-tests \
            --claim api.replay-assembly-boundary \
            --reason governance_only \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
      - name: Set up Python
        if: steps.impact.outputs.classification == 'runtime'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements-test.lock
            api/requirements-base.lock
            api/requirements-live.lock
      - name: Install locked test and offline-live dependencies
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          python3 tools/ci_proof.py run \
            --claim api.dependencies \
            --category external \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -m pip install --disable-pip-version-check --no-deps --requirement api/requirements-test.lock
          python3 tools/ci_proof.py run \
            --claim api.dependencies \
            --category external \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -m pip install --disable-pip-version-check --no-deps --require-hashes --requirement api/requirements-base.lock
          python3 tools/ci_proof.py run \
            --claim api.dependencies \
            --category external \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -m pip install --disable-pip-version-check --no-deps --require-hashes --requirement api/requirements-live.lock
      - name: Install pinned pip-audit for candidate audit
        if: steps.impact.outputs.classification == 'runtime' && steps.impact.outputs.api_dependency_files_changed == 'true'
        run: |
          python3 tools/ci_proof.py run \
            --claim api.audit-tool-install \
            --category external \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            pipx install pip-audit==2.10.1
      - name: Audit API dependency locks (blocking only on dependency changes)
        if: steps.impact.outputs.classification == 'runtime' && steps.impact.outputs.api_dependency_files_changed == 'true'
        run: |
          python3 tools/ci_proof.py run \
            --claim api.dependency-advisory \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            pip-audit --disable-pip --no-deps --requirement api/requirements-base.lock
          python3 tools/ci_proof.py run \
            --claim api.dependency-advisory \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            pip-audit --disable-pip --no-deps --requirement api/requirements-live.lock
          python3 tools/ci_proof.py run \
            --claim api.dependency-advisory \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            pip-audit --disable-pip --no-deps --requirement api/requirements-test.lock
      - name: Record skipped dependency audit (dependencies unchanged)
        if: steps.impact.outputs.classification == 'runtime' && steps.impact.outputs.api_dependency_files_changed == 'false'
        run: |
          python3 tools/ci_proof.py skip \
            --claim api.audit-tool-install \
            --claim api.dependency-advisory \
            --reason dependencies_unchanged \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
      - name: Download and verify the pinned embedding model
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          python3 tools/ci_proof.py run \
            --claim api.model-download \
            --category external \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python deploy/download_embedding_model.py \
              --manifest api/src/traceable_support/retrieval/bge-small-zh-v1.5-fastembed.json \
              --root "$RUNNER_TEMP/traceable-model"
      - name: Run API, SQLite, budget and offline product tests
        if: steps.impact.outputs.classification == 'runtime'
        env:
          PYTHONPATH: api/src
          TRACEABLE_MODEL_ROOT: ${{ runner.temp }}/traceable-model/artifacts/models/fastembed/fast-bge-small-zh-v1.5
        run: |
          python3 tools/ci_proof.py run \
            --claim api.product-tests \
            --category product \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -m pytest api/tests
      - name: Run pgvector store integration tests
        if: steps.impact.outputs.classification == 'runtime'
        env:
          PYTHONPATH: api/src
          PGVECTOR_TEST_DSN: postgresql://traceable@127.0.0.1:5432/traceable_test
        run: |
          python3 tools/ci_proof.py run \
            --claim api.pgvector-store \
            --category product \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -m pytest api/tests/test_pgvector_store.py
      - name: Run Stage 12 evaluation runner and freeze checker tests
        if: steps.impact.outputs.classification == 'runtime'
        env:
          PYTHONPATH: api/src
          TRACEABLE_MODEL_ROOT: ${{ runner.temp }}/traceable-model/artifacts/models/fastembed/fast-bge-small-zh-v1.5
        run: |
          python3 tools/ci_proof.py run \
            --claim api.eval-runner-tests \
            --category product \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -m pytest tools/tests/test_stage12_eval.py
      - name: Prove replay control plane has no site dependency
        if: steps.impact.outputs.classification == 'runtime'
        env:
          PYTHONPATH: api/src
        run: |
          python3 tools/ci_proof.py run \
            --claim api.replay-assembly-boundary \
            --category boundary \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" -- \
            python -S -c "from traceable_support.api.runs import PublicRunService; assert PublicRunService.live_available is not None"
      - name: Publish proof summary
        if: always()
        run: |
          python3 tools/ci_proof.py summary \
            --job api \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --expect api.dependencies \
            --expect api.model-download \
            --expect api.audit-tool-install \
            --expect api.dependency-advisory \
            --expect api.product-tests \
            --expect api.pgvector-store \
            --expect api.eval-runner-tests \
            --expect api.replay-assembly-boundary

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]]; then
            base_sha="$PUSH_BASE_SHA"
          fi
          python tools/ci_impact.py \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record skipped runtime checks (governance-only change)
        if: steps.impact.outputs.classification == 'governance_only'
        run: |
          python3 tools/ci_proof.py skip \
            --claim containers.image-build \
            --claim containers.replay-smoke \
            --claim containers.offline-live \
            --reason governance_only \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
      - name: Set up Buildx
        if: steps.impact.outputs.classification == 'runtime'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build Web and replay images
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          set +e
          status=0
          docker build --build-arg "VCS_REF=$GITHUB_SHA" -t traceable-web:test web || { echo "web_image_build_failed" >&2; status=1; }
          docker build --target replay --build-arg "VCS_REF=$GITHUB_SHA" -t traceable-api-replay:test -f api/Dockerfile . || { echo "replay_image_build_failed" >&2; status=1; }
          python3 tools/ci_proof.py record \
            --claim containers.image-build \
            --category product \
            --exit-code "$status" \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
          exit "$status"
      - name: Smoke replay images without model or credential
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          set +e
          status=0
          test "$(docker image inspect --format '{{.Config.User}}' traceable-web:test)" = "node" || { echo "web_image_user_invalid" >&2; status=1; }
          test "$(docker image inspect --format '{{.Config.User}}' traceable-api-replay:test)" = "10001:10001" || { echo "api_image_user_invalid" >&2; status=1; }
          docker run --rm --entrypoint python --network none traceable-api-replay:test -S -c \
            "from traceable_support.api.runs import PublicRunService; assert PublicRunService.live_available is not None" \
            || { echo "replay_assembly_failed" >&2; status=1; }
          docker run -d --name traceable-api-replay-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /var/lib/traceable:rw,noexec,nosuid,uid=10001,gid=10001,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e TRACEABLE_PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            -e TRACEABLE_PUBLIC_LIVE_ENABLED=false -p 127.0.0.1:8000:8000 \
            traceable-api-replay:test || { echo "api_container_start_failed" >&2; status=1; }
          docker run -d --name traceable-web-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:3000:3000 traceable-web:test || { echo "web_container_start_failed" >&2; status=1; }
          trap 'docker rm -f traceable-web-ci traceable-api-replay-ci >/dev/null 2>&1 || true' EXIT
          api_ready=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 1 http://127.0.0.1:8000/api/v1/health >"$RUNNER_TEMP/health.json"; then
              api_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$api_ready" != true ]]; then
            echo "api_container_not_ready" >&2
            docker logs traceable-api-replay-ci >&2 || true
            status=1
          else
            python -c 'import json,os,pathlib; value=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"health.json").read_text()); assert value["live_experience"] == "replay_only" and value["release_sha"] == os.environ["GITHUB_SHA"]' \
              || { echo "health_release_identity_invalid" >&2; status=1; }
          fi
          web_ready=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 1 http://127.0.0.1:3000/ >/dev/null; then
              web_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$web_ready" != true ]]; then
            echo "web_container_not_ready" >&2
            docker logs traceable-web-ci >&2 || true
            status=1
          fi
          for route in / /design /app /privacy; do
            if ! curl --fail --silent --show-error "http://127.0.0.1:3000$route" >/dev/null; then
              echo "container_route_failed:$route" >&2
              status=1
            fi
          done
          python3 tools/ci_proof.py record --claim containers.replay-smoke --category product --exit-code "$status" --proof "$RUNNER_TEMP/ci-proof.jsonl"
          exit "$status"
      - name: Build live target but verify only offline retrieval
        if: steps.impact.outputs.classification == 'runtime'
        run: |
          set +e
          status=0
          docker build --target live --build-arg "VCS_REF=$GITHUB_SHA" -t traceable-api-live-offline:test -f api/Dockerfile . \
            || { echo "live_image_build_failed" >&2; status=1; }
          if [[ "$status" == 0 ]]; then
            docker run --rm --network none \
              -v "$PWD/evals:/verification/evals:ro" \
              -v "$PWD/tools/check_live_retrieval.py:/verification/check_live_retrieval.py:ro" \
              --entrypoint python traceable-api-live-offline:test \
              /verification/check_live_retrieval.py \
              || { echo "offline_live_check_failed" >&2; status=1; }
          fi
          python3 tools/ci_proof.py record \
            --claim containers.offline-live \
            --category boundary \
            --exit-code "$status" \
            --proof "$RUNNER_TEMP/ci-proof.jsonl"
          exit "$status"
      - name: Publish proof summary
        if: always()
        run: |
          python3 tools/ci_proof.py summary \
            --job containers \
            --proof "$RUNNER_TEMP/ci-proof.jsonl" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --expect containers.image-build \
            --expect containers.replay-smoke \
            --expect containers.offline-live

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'suuny-ab/traceable-support-agent' &&
      needs.governance.outputs.classification == 'runtime'
    needs: [governance, web, api, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR with the repository token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Web image
        id: web_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/suuny-ab/traceable-support-agent-web:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Publish replay API image
        id: api_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: api/Dockerfile
          target: replay
          platforms: linux/amd64
          push: true
          tags: ghcr.io/suuny-ab/traceable-support-agent-api-replay:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=api-replay
          cache-to: type=gha,mode=max,scope=api-replay
      - name: Generate immutable release manifest
        env:
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
          API_DIGEST: ${{ steps.api_image.outputs.digest }}
        run: |
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python tools/release_manifest.py \
            --git-sha "$GITHUB_SHA" \
            --web-image "ghcr.io/suuny-ab/traceable-support-agent-web@$WEB_DIGEST" \
            --api-image "ghcr.io/suuny-ab/traceable-support-agent-api-replay@$API_DIGEST" \
            --built-at "$built_at" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output release-manifest.json
          python tools/release_manifest.py --verify release-manifest.json
      - name: Store release manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
