name: 元开发
description: 登记以 Agent 如何开发产品为对象的治理候选
title: "meta: "
labels: ["meta"]
body:
  - type: textarea
    id: friction
    attributes:
      label: 真实摩擦
      description: 哪个反复出现或系统性的摩擦影响了产品结果、质量或恢复？
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: 最小变化与证伪
      description: 最小治理候选是什么，怎样最便宜地证明它不成立？
    validations:
      required: true
  - type: textarea
    id: carrier
    attributes:
      label: 产品验证载体与停止线
      description: 用哪个真实产品增量验证，何时必须停止并返回产品主线？
    validations:
      required: true
